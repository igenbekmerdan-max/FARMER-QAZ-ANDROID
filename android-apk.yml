name: Build FARMER QAZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install JavaScript dependencies
        run: npm install

      - name: Validate application JavaScript
        run: |
          node --check public/app.js
          node --check public/sw.js
          node --check functions/index.js
          node tests/run_unit_tests.mjs

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root_candidates = [Path('android/build.gradle.kts'), Path('android/build.gradle')]
          app_candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          root = next((p for p in root_candidates if p.exists()), None)
          app = next((p for p in app_candidates if p.exists()), None)
          if not root or not app:
              raise SystemExit('Gradle files not found in generated Android project')
          root_text = root.read_text()
          if 'com.google.gms.google-services' not in root_text:
              plugin_line = ('id("com.google.gms.google-services") version "4.6.0" apply false' if root.suffix == '.kts' else "id 'com.google.gms.google-services' version '4.6.0' apply false")
              match = re.search(r'plugins\\s*\\{', root_text)
              if match:
                  root_text = root_text[:match.end()] + '\\n    ' + plugin_line + root_text[match.end():]
              else:
                  root_text = 'plugins {\\n    ' + plugin_line + '\\n}\\n\\n' + root_text
              root.write_text(root_text)
          app_text = app.read_text()
          if 'com.google.gms.google-services' not in app_text:
              plugin_line = ('id("com.google.gms.google-services")' if app.suffix == '.kts' else "id 'com.google.gms.google-services'")
              match = re.search(r'plugins\\s*\\{', app_text)
              if match:
                  app_text = app_text[:match.end()] + '\\n    ' + plugin_line + app_text[match.end():]
              else:
                  app_text = 'plugins {\\n    ' + plugin_line + '\\n}\\n\\n' + app_text
              app.write_text(app_text)
          print('Google Services plugin configured')
          PY

      - name: Copy web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FARMER-QAZ-v2.1.2-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
